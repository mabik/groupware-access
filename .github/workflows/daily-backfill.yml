name: Daily backfill — catch missed access requests

# 워크플로우가 main auto-invite trigger를 놓친 신청을 매일 감지·처리.
# 원인 가능성:
#   - GitHub spam moderation이 신규 계정 issue 숨김 (workflow 미트리거)
#   - issue가 access-request 라벨 없이 작성됨
#   - 첫 시도 실패 후 재실행 안 됨
#
# 동작:
#   1. mabik/groupware-access의 미처리 open issue 조회 (admin PAT으로 spam 포함)
#   2. 5분 넘게 처리 안 된 issue 발견 시 main 워크플로우와 동일 로직 실행
#   3. 처리 후 redact + delete (PRIVACY_MODE=delete)
#   4. 실패한 issue는 audit 리포에 admin 알림 issue 작성

on:
  schedule:
    - cron: '*/30 * * * *'  # 30분마다 (UTC)

permissions:
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      PRIVATE_OWNER: mabik
      PRIVATE_REPO: groupware
      ALLOWED_DOMAIN: mabik.re.kr
      AUDIT_OWNER: mabik
      AUDIT_REPO: groupware-audit
      ADMIN_USERNAMES: "methylome,mabik-bot"
      STALE_THRESHOLD_MINUTES: 5
    steps:
      - name: Find unprocessed issues
        id: scan
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.OWNER_PAT }}
          script: |
            const { STALE_THRESHOLD_MINUTES } = process.env;
            const threshold = Date.now() - parseInt(STALE_THRESHOLD_MINUTES) * 60 * 1000;

            // open issues 조회 — owner PAT은 spam-flagged도 일부 볼 수 있음
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            // access-request 라벨 또는 [access-request] 제목, threshold 초과
            const stale = issues.filter(i => {
              const isAccessRequest =
                i.labels.some(l => l.name === 'access-request') ||
                i.title.includes('access-request') ||
                i.title.includes('액세스 요청');
              const isStale = new Date(i.created_at).getTime() < threshold;
              return isAccessRequest && isStale;
            });

            core.setOutput('count', stale.length);
            core.setOutput('issues', JSON.stringify(stale.map(i => ({
              number: i.number,
              node_id: i.node_id,
              author: i.user.login,
              created_at: i.created_at,
              body: i.body || '',
              labels: i.labels.map(l => l.name),
            }))));

            console.log(`Found ${stale.length} unprocessed access-request issue(s).`);

      - name: Notify admin in audit repo
        if: steps.scan.outputs.count != '0'
        uses: actions/github-script@v9
        env:
          ISSUES_JSON: ${{ steps.scan.outputs.issues }}
        with:
          github-token: ${{ secrets.OWNER_PAT }}
          script: |
            const { ISSUES_JSON, AUDIT_OWNER, AUDIT_REPO } = process.env;
            const stale = JSON.parse(ISSUES_JSON);

            const lines = [
              '## Daily backfill — 미처리 access-request 발견',
              '',
              `검사 시각: ${new Date().toISOString()}`,
              `미처리 건수: ${stale.length}`,
              '',
              '| Issue | 작성자 | 생성 시각 | 라벨 |',
              '|-------|--------|-----------|------|',
              ...stale.map(s =>
                `| #${s.number} | @${s.author} | ${s.created_at} | ${s.labels.join(', ') || '(없음)'} |`
              ),
              '',
              '**원인 추정:**',
              '- access-request 라벨 누락 → 메인 워크플로우 미트리거',
              '- spam moderation으로 hide된 issue가 늦게 visible해짐',
              '- 메인 워크플로우 실패 (Actions 탭에서 확인)',
              '',
              '**조치:**',
              `1. https://github.com/${context.repo.owner}/${context.repo.repo}/issues 에서 각 issue 확인`,
              '2. 정상이면 라벨 수동 추가 → 메인 워크플로우 재트리거',
              '3. 또는 admin이 직접 `gh api PUT collaborators/<user>` 실행 후 issue 닫기/삭제',
            ];

            await github.rest.issues.create({
              owner: AUDIT_OWNER,
              repo: AUDIT_REPO,
              title: `[backfill-alert] ${stale.length} unprocessed request(s) on ${new Date().toISOString().slice(0,10)}`,
              body: lines.join('\n'),
              labels: ['audit', 'backfill-alert'],
            });

  # Shape B onboarding (mabik/groupware#248) — graduate legacy direct-collabs
  # to the unified Member + staff-team channel.
  #
  # Sweeps Outside Collaborators on mabik/groupware whose org-membership
  # AND staff-team-membership are BOTH already `active`. That state means
  # they've completed the Shape B onboarding (the org invite was accepted
  # and the team add stuck) but their pre-existing direct-collab grant is
  # still hanging around as duplicated state. Removing the direct-collab
  # grant collapses everyone to one channel without disturbing access.
  #
  # SAFETY: this job ONLY removes the redundant collab grant — never
  # invites, never adds to teams, never affects anyone whose org or team
  # state is anything other than `active` (pending/inactive/missing all
  # short-circuit to skip-silently). Operationally that means: legacy
  # Outside Collabs who haven't been promoted to Member yet are left
  # untouched and surface in the org via the existing audit/backfill
  # alerting; this job only fires on users for whom both pieces of state
  # already coexist, so the worst-case is a no-op cycle.
  #
  # Hard-coded exclusion: `mabik-bot` stays an Outside Collab with admin
  # rights by design (per CJH lock); never graduated.
  graduate-legacy-collabs:
    runs-on: ubuntu-latest
    env:
      PRIVATE_OWNER: mabik
      PRIVATE_REPO: groupware
      STAFF_TEAM_SLUG: staff
      AUDIT_OWNER: mabik
      AUDIT_REPO: groupware-audit
      # Outside Collabs that must NEVER be graduated. Comma-separated
      # GitHub username list, lowercased at compare time.
      SKIP_USERNAMES: "mabik-bot"
    steps:
      - name: Scan + graduate Outside Collabs whose org+team state is active
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.ADMIN_PAT }}
          script: |
            const {
              PRIVATE_OWNER, PRIVATE_REPO, STAFF_TEAM_SLUG,
              AUDIT_OWNER, AUDIT_REPO, SKIP_USERNAMES,
            } = process.env;
            const skip = new Set(
              (SKIP_USERNAMES || '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean)
            );

            // Audit-issue writer for the `graduated` status verb. Modeled on
            // auto-invite.yml's writeAudit helper but with graduation-specific
            // fields (no email/dept/purpose — those came from the original
            // access-request form, which is long gone by the time a user
            // becomes eligible for graduation).
            const writeAudit = async (username, extra = {}) => {
              try {
                await github.rest.issues.create({
                  owner: AUDIT_OWNER,
                  repo: AUDIT_REPO,
                  title: `[graduated] ${username}`,
                  body: [
                    '## 직접-collab 정리 (Shape B 단일채널 마이그레이션)',
                    '',
                    '**status:** graduated',
                    extra.reason ? `**note:** ${extra.reason}` : '',
                    '',
                    '| 항목 | 값 |',
                    '|------|-----|',
                    `| GitHub 사용자명 | ${username} |`,
                    `| 처리 시각 | ${new Date().toISOString()} |`,
                    `| org 멤버십 | active |`,
                    `| ${STAFF_TEAM_SLUG} 팀 멤버십 | active |`,
                    `| 적용 작업 | mabik/${PRIVATE_REPO} 직접-collab 제거 |`,
                    `| 참고 | mabik/groupware#248 (Shape B onboarding) |`,
                  ].filter(Boolean).join('\n'),
                  labels: ['audit', 'graduated'],
                });
              } catch (e) {
                core.warning(`graduated audit write failed for ${username}: ${e.message}`);
              }
            };

            // 1) Enumerate Outside Collaborators on the private repo.
            const outside = await github.paginate(
              github.rest.repos.listCollaborators,
              { owner: PRIVATE_OWNER, repo: PRIVATE_REPO, affiliation: 'outside', per_page: 100 },
            );
            console.log(`Found ${outside.length} outside collaborator(s) on ${PRIVATE_OWNER}/${PRIVATE_REPO}.`);

            let graduatedCount = 0;
            const skipped = [];

            for (const c of outside) {
              const username = c.login;
              const lower = username.toLowerCase();
              if (skip.has(lower)) {
                skipped.push({ username, reason: 'hard-coded skip' });
                continue;
              }

              // 2) Org membership state must be `active`.
              let orgState;
              try {
                const m = await github.rest.orgs.getMembershipForUser({
                  org: PRIVATE_OWNER, username,
                });
                orgState = m.data.state;
              } catch (e) {
                if (e.status === 404) {
                  skipped.push({ username, reason: 'not org member' });
                  continue;
                }
                core.warning(`org membership check failed for ${username}: ${e.message}`);
                skipped.push({ username, reason: `org check error: ${e.message}` });
                continue;
              }
              if (orgState !== 'active') {
                skipped.push({ username, reason: `org state=${orgState}` });
                continue;
              }

              // 3) staff-team membership state must be `active`.
              let teamState;
              try {
                const m = await github.rest.teams.getMembershipForUserInOrg({
                  org: PRIVATE_OWNER, team_slug: STAFF_TEAM_SLUG, username,
                });
                teamState = m.data.state;
              } catch (e) {
                if (e.status === 404) {
                  skipped.push({ username, reason: `not in ${STAFF_TEAM_SLUG} team` });
                  continue;
                }
                core.warning(`team membership check failed for ${username}: ${e.message}`);
                skipped.push({ username, reason: `team check error: ${e.message}` });
                continue;
              }
              if (teamState !== 'active') {
                skipped.push({ username, reason: `team state=${teamState}` });
                continue;
              }

              // 4) Both states active → remove the direct-collab grant.
              try {
                await github.rest.repos.removeCollaborator({
                  owner: PRIVATE_OWNER, repo: PRIVATE_REPO, username,
                });
              } catch (e) {
                core.warning(`removeCollaborator failed for ${username}: ${e.message}`);
                skipped.push({ username, reason: `remove failed: ${e.message}` });
                continue;
              }
              graduatedCount++;
              await writeAudit(username);
              console.log(`Graduated ${username} (direct-collab grant removed; access continues via ${STAFF_TEAM_SLUG} team).`);
            }

            console.log(`Cycle complete: graduated=${graduatedCount}, skipped=${skipped.length}.`);
            for (const s of skipped) console.log(`  skip ${s.username}: ${s.reason}`);

            core.setOutput('graduated', String(graduatedCount));
