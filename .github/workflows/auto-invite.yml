name: Auto-invite to private repo

# 동작:
# 1. 사용자가 access-request 폼으로 issue 작성 (잠시 공개됨, 수 초~1분)
# 2. 본 워크플로우가 즉시 작동:
#    a. 입력값 파싱 (GitHub 사용자명은 폼 입력이 아니라 issue 작성자 계정에서 자동 도출)
#    b. 협업자 등록 (자동초대)
#    c. 감사 로그를 private audit 리포에 복사 (PII 보존)
#    d. 원본 issue body를 "[처리됨]"으로 redact (edit history도 sanitize)
#    e. 원본 issue 삭제 (공개 흔적 제거)
# 3. 사용자에게는 GitHub 초대 메일이 도착 (자기 verified email로)
#
# Privacy 모드 옵션:
#   PRIVACY_MODE=delete  (기본) — issue redact + 삭제, 공개 흔적 zero
#   PRIVACY_MODE=lock           — issue redact + 잠금, 공개 흔적은 "[처리됨]"만
#   PRIVACY_MODE=keep            — 원본 그대로 (디버깅용, 운영 미권장)

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  invite:
    if: contains(github.event.issue.labels.*.name, 'access-request')
    runs-on: ubuntu-latest
    env:
      PRIVATE_OWNER: mabik
      PRIVATE_REPO: groupware
      ALLOWED_DOMAIN: mabik.re.kr
      AUDIT_OWNER: mabik
      AUDIT_REPO: groupware-audit
      PRIVACY_MODE: delete
      # Admin/bot 계정 — 콤마 구분 GitHub username 목록. 향후 추가 검증을
      # 도입할 경우 이 목록의 계정은 우회시킨다.
      ADMIN_USERNAMES: "methylome,mabik-bot"
    steps:
      - name: Checkout (필요 — issue parser가 템플릿 파일을 디스크에서 읽음)
        uses: actions/checkout@v4

      - name: Mask PII in logs
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          # 본문을 줄 단위로 즉시 마스킹 처리. Action 로그에 PII가 새지 않도록.
          # (::add-mask::는 줄 단위로만 동작 — 통째로 넘기면 첫 줄만 마스킹됨)
          # CRLF 정규화 — 빈 줄의 잔여 \r이 empty-mask 경고를 내거나, 줄 중간
          # \r이 커맨드를 쪼개 나머지를 raw로 노출하는 것을 방지
          BODY="${BODY//$'\r'/$'\n'}"
          while IFS= read -r line; do
            if [ -n "$line" ]; then echo "::add-mask::$line"; fi
          done <<< "${BODY}"

      - name: Parse issue body
        id: parse
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: .github/ISSUE_TEMPLATE/access-request.yml

      - name: Mask parsed values in logs
        env:
          # 사용자 입력을 ${{ }}로 스크립트에 직접 보간하지 말 것 (shell injection) — env로 전달
          FULL_NAME: ${{ steps.parse.outputs.issueparser_full_name }}
          DEPT: ${{ steps.parse.outputs.issueparser_department }}
        run: |
          if [ -n "$FULL_NAME" ]; then echo "::add-mask::${FULL_NAME}"; fi
          if [ -n "$DEPT" ]; then echo "::add-mask::${DEPT}"; fi

      - name: Normalize issue title (overwrite user-edited title)
        uses: actions/github-script@v7
        env:
          USERNAME: ${{ github.event.issue.user.login }}
        with:
          github-token: ${{ secrets.ADMIN_PAT }}
          script: |
            const username = (process.env.USERNAME || '').trim() || 'unknown';
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              title: `[액세스 요청] @${username}`,
            });

      - name: Validate, invite, audit-log
        id: process
        uses: actions/github-script@v7
        env:
          # 폼 입력이 아니라 issue 작성자 계정 — 본인 인증이 구조적으로 보장됨
          USERNAME: ${{ github.event.issue.user.login }}
          FULL_NAME: ${{ steps.parse.outputs.issueparser_full_name }}
          DEPT: ${{ steps.parse.outputs.issueparser_department }}
          CLIENT: ${{ steps.parse.outputs.issueparser_client }}
          PURPOSE: ${{ steps.parse.outputs.issueparser_purpose }}
        with:
          github-token: ${{ secrets.ADMIN_PAT }}
          script: |
            const {
              USERNAME, FULL_NAME, DEPT, CLIENT, PURPOSE,
              PRIVATE_OWNER, PRIVATE_REPO, ALLOWED_DOMAIN,
              AUDIT_OWNER, AUDIT_REPO, ADMIN_USERNAMES,
            } = process.env;

            const submitter = context.payload.issue.user.login.toLowerCase();
            const adminList = (ADMIN_USERNAMES || '')
              .split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
            const isAdmin = adminList.includes(submitter);

            // Helper: 결과(어떤 분기든)를 audit 리포에 기록.
            // invite 단계에서 어떤 분기로 가든 한 건씩 audit issue를 남긴다.
            const writeAudit = async (status, extra = {}) => {
              try {
                await github.rest.issues.create({
                  owner: AUDIT_OWNER,
                  repo: AUDIT_REPO,
                  // No `@` prefix on usernames — would auto-mention the user.
                  // Brand-new accounts (created < ~30min before issue) trip
                  // GitHub's anti-abuse heuristic and the audit issue gets
                  // shadow-suppressed from listings/search. The audit log is
                  // for admin review, not user notification, so the `@`
                  // adds no value and only triggers the suppression.
                  title: `[${status}] ${(USERNAME || 'unknown').trim()}` +
                         (FULL_NAME ? ` (${FULL_NAME.trim()})` : ''),
                  body: [
                    '## 액세스 요청 처리 기록',
                    '',
                    `**status:** ${status}`,
                    extra.reason ? `**reason:** ${extra.reason}` : '',
                    '',
                    '| 항목 | 값 |',
                    '|------|-----|',
                    `| 작성자(GitHub) | ${submitter} |`,
                    `| 성명 | ${(FULL_NAME || '').trim() || '-'} |`,
                    `| 이메일(추정) | \`${extra.email || '-'}\` |`,
                    `| 부서 | ${(DEPT || '').trim() || '-'} |`,
                    `| 사용 환경 | ${(CLIENT || '').trim() || '-'} |`,
                    `| 사용 목적 | ${(PURPOSE || '').trim() || '-'} |`,
                    `| 처리 시각 | ${new Date().toISOString()} |`,
                    `| 원본 신청 | ${context.repo.owner}/${context.repo.repo}#${context.issue.number} (삭제 예정) |`,
                    `| Admin allowlist? | ${isAdmin ? 'yes' : 'no'} |`,
                  ].filter(Boolean).join('\n'),
                  labels: ['audit', status],
                });
              } catch (e) {
                core.warning(`Audit log creation failed: ${e.message}`);
              }
            };

            const setStatus = async (status, reason, extra = {}) => {
              core.setOutput('status', status);
              if (reason) core.setOutput('reason', reason);
              await writeAudit(status, { ...extra, reason });
            };

            // 1) 필수 필드. username은 issue 작성자 계정에서 도출되므로 항상
            // 존재하며, 본인 인증(사칭 차단)도 구조적으로 보장된다 — 다른 사람의
            // username을 적어 초대를 끌어가는 경로 자체가 없다.
            const username = (USERNAME || '').trim();
            const fullName = (FULL_NAME || '').trim();
            if (!fullName) {
              return setStatus('rejected', '성명이 비어 있습니다.', { email: '-' });
            }

            // 2) Public email 검증 (username은 작성자 계정이므로 항상 존재).
            // 이메일은 사용자가 Settings → Public profile → Public email로
            // 공개 설정한 verified 주소만 API에 노출되므로 실제 소유 증명임.
            // 비공개 상태면 .email === null → "Public email 미설정" 안내.
            let email;
            try {
              const u = await github.rest.users.getByUsername({ username });
              email = (u.data.email || '').toLowerCase();
            } catch (e) {
              // username은 issue 작성자라 항상 존재 — 여기 도달하면 API 장애다.
              return setStatus('rejected',
                `GitHub 계정 정보 조회에 실패했습니다 (일시적 오류일 수 있음): ${e.message}. 잠시 후 다시 신청해주세요.`,
                { email: '-' });
            }
            if (!isAdmin && !email) {
              return setStatus('rejected',
                `GitHub Public email이 설정되어 있지 않습니다. Settings → Public profile → Public email을 사내 이메일(@${ALLOWED_DOMAIN})로 지정 후 재신청해주세요. (초대 수락 후 다시 비공개로 돌릴 수 있습니다.)`,
                { email: '-' });
            }
            if (!isAdmin && !email.endsWith('@' + ALLOWED_DOMAIN)) {
              return setStatus('rejected',
                `GitHub Public email(${email})이 사내 도메인(@${ALLOWED_DOMAIN})이 아닙니다.`,
                { email });
            }

            // 3) 이미 조직 멤버인지
            try {
              const m = await github.rest.orgs.getMembershipForUser({
                org: PRIVATE_OWNER, username,
              });
              const state = m.data.state;
              if (state === 'active') {
                return setStatus('already-member', '이미 조직 멤버입니다.', { email });
              }
              if (state === 'pending') {
                // 초대 발송 후 미수락. 재초대 spam을 피하려고 short-circuit.
                return setStatus('invite-pending',
                  '초대가 이미 발송되었으나 아직 수락되지 않았습니다.',
                  { email });
              }
            } catch (e) {
              if (e.status !== 404) {
                return setStatus('rejected', `조직 멤버 상태 확인 실패: ${e.message}`, { email });
              }
            }

            // 4) 조직 멤버 등록
            try {
              await github.rest.orgs.setMembershipForUser({
                org: PRIVATE_OWNER, username, role: 'member',
              });
            } catch (e) {
              return setStatus('rejected', `자동 초대 실패: ${e.message}`, { email });
            }

            // 5) staff 팀 자동 추가 (Shape B — mabik/groupware#248)
            // 단일 채널 멤버십 모델: mabik/staff 팀이 mabik/groupware의 Read 권한을
            // 부여한다 (default_repository_permission='none' 가정). org 초대 수락 전에
            // 호출해도 pending 상태로 큐잉되며, 사용자가 org 초대를 수락하는 순간
            // org member + team member가 동시에 active로 전환된다.
            // 실패는 비치명적: 사용자는 org 초대 자체는 받았으므로 운영자가 수동으로
            // 보강할 수 있고, daily-backfill의 graduate-legacy-collabs 잡이 다음
            // 사이클에서 동일 상태(org active && team active) 검사로 재시도 가능.
            try {
              await github.rest.teams.addOrUpdateMembershipForUserInOrg({
                org: PRIVATE_OWNER, team_slug: 'staff', username, role: 'member',
              });
            } catch (e) {
              core.warning(`staff 팀 자동 추가 실패 (사용자는 org 초대만 수신): ${e.message}`);
            }

            return setStatus('invited', '초대 완료', { email });

      - name: Notify user (status comment)
        uses: actions/github-script@v7
        env:
          # reason에는 사용자 email/API 오류 메시지가 섞일 수 있음 — 스크립트에 직접 보간 금지
          STATUS: ${{ steps.process.outputs.status }}
          REASON: ${{ steps.process.outputs.reason }}
        with:
          github-token: ${{ secrets.ADMIN_PAT }}
          script: |
            const status = process.env.STATUS || '';
            const reason = process.env.REASON || '';

            const messages = {
              'invited': '✅ 조직 초대 메일이 발송됐습니다. 본인 GitHub 계정의 verified email을 확인하세요. 초대 수락 시 자동으로 `mabik/staff` 팀에 추가되어 `mabik/groupware` 접근이 활성화됩니다 (별도 작업 필요 없음). 본 신청 기록은 개인정보 보호를 위해 곧 자동 삭제됩니다.',
              'already-member': 'ℹ️ 이미 조직 멤버입니다. 추가 작업 필요 없습니다. 본 신청은 곧 자동 삭제됩니다.',
              'invite-pending': '✉️ 초대 메일을 보냈으니 본인 GitHub 계정의 verified email을 확인해주세요. 초대 수락 시 `mabik/staff` 팀에 자동 추가됩니다. 본 신청은 곧 자동 삭제됩니다.',
              'rejected': `❌ 거부 — ${reason}\n\n다시 신청하시려면 새 issue를 작성해주세요. 본 신청은 곧 자동 삭제됩니다.`,
            };

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: messages[status] || `처리 결과 없음`,
            });

      - name: Pre-redact body (sanitize edit history)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ADMIN_PAT }}
          script: |
            // edit history에 PII 잔존을 막기 위해 본문을 먼저 sanitize
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              title: '[처리됨]',
              body: '[processed - PII purged]',
              state: 'closed',
              state_reason: 'completed',
            });

      - name: Privacy action (delete | lock | keep)
        if: env.PRIVACY_MODE != 'keep'
        env:
          # OWNER_PAT은 issue 삭제 권한이 있는 org owner의 PAT (예: methylome).
          # ADMIN_PAT(mabik-bot)으로 fallback — lock 모드에서는 admin으로 충분.
          # delete 모드에서 OWNER_PAT 미설정 시 deleteIssue가 FORBIDDEN으로 실패함.
          GH_TOKEN: ${{ secrets.OWNER_PAT || secrets.ADMIN_PAT }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
        run: |
          if [ "$PRIVACY_MODE" = "delete" ]; then
            echo "Deleting issue (PRIVACY_MODE=delete)..."
            gh api graphql -f query='
              mutation($id: ID!) {
                deleteIssue(input: { issueId: $id }) {
                  repository { id }
                }
              }
            ' -f id="$ISSUE_NODE_ID"
          elif [ "$PRIVACY_MODE" = "lock" ]; then
            echo "Locking issue (PRIVACY_MODE=lock)..."
            gh api -X PUT "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/lock" \
              -f lock_reason=resolved
          fi
